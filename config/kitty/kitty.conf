font_size 14.5
font_family JetBrainsMono NF
background_opacity 0.9
cursor_trail 1
mouse_hide_wait -1
hide_window_decorations yes
copy_on_select true
confirm_os_window_close -1
dynamic_background_opacity yes
clear_all_shortcuts yes
touch_scroll_multiplier 8.0
remember_window_size no

tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
include themes/catppuccin-dark.conf
include ~/.cache/kitty-theme.conf

map ctrl+shift+v paste_from_clipboard
map ctrl+shift+up set_background_opacity +0.05
map ctrl+shift+down set_background_opacity -0.05
map ctrl+equal change_font_size all +0.5
map ctrl+minus change_font_size all -0.5

map ctrl+shift+r load_config_file
map ctrl+t new_os_window_with_cwd
map ctrl+e new_os_window_with_cwd nvim .
map ctrl+shift+e launch --stdin-source=@screen_scrollback --type=overlay "nvim +$"
